server:
  address: ${GATEWAY_BIND_ADDRESS:127.0.0.1}
  port: 8082
  compression:
    enabled: true
    min-response-size: 1024
  # Preserve the transport peer; the limiter validates forwarding headers itself.
  forward-headers-strategy: none

spring:
  profiles:
    default: local
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 15s
            # Downstream Tomcat closes idle keep-alive connections after ~60s. Retiring pooled connections earlier
            # avoids reusing one the service just closed ("Connection prematurely closed" → sporadic 502).
            pool:
              max-idle-time: 30s
              max-life-time: 10m
              eviction-interval: 30s
          discovery:
            locator:
              enabled: false

          routes:
            - id: notification-websocket
              uri: lb:ws://notification-service
              order: -1
              predicates:
                - Path=/api/notification/ws
            - id: notification-operations
              uri: lb://notification-service
              predicates:
                - Path=/api/notification/admin/**,/api/notification/staff/**,/api/notification/broadcasts
            - id: auth-websocket
              uri: lb:ws://user-service
              order: -2
              predicates:
                - Path=/ws/native,/ws/*/*/websocket
            - id: auth-sockjs
              uri: lb://user-service
              predicates:
                - Path=/ws/**
            - id: japanese-ai
              uri: lb://nihongo-user-service
              metadata:
                response-timeout: 70000
              predicates:
                - Path=/api/nihongo-user/japanese
            - id: wallet-websocket
              uri: lb:ws://nihongo-user-service
              predicates:
                - Path=/api/nihongo-user/wallets/ws

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**,/api/users/**,/api/active-user/**,/images/**
            - id: admin-service
              uri: lb://admin-service
              predicates:
                - Path=/api/admin/**
            - id: staff-service
              uri: lb://staff-service
              predicates:
                - Path=/api/staff/**
            - id: staff-performance-websocket
              uri: lb:ws://staff-service
              order: -1
              predicates:
                - Path=/api/staff/vps-performance/ws

            - id: nihongo-user-service
              uri: lb://nihongo-user-service
              predicates:
                - Path=/api/nihongo-user/**
eureka:
  instance:
    prefer-ip-address: true
    ip-address: ${SERVICE_ADVERTISED_ADDRESS:127.0.0.1}

  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true

jwt:
  secret: ${JWT_SECRET:}

auth:
  session-validation-url: ${AUTH_SESSION_VALIDATION_URL:http://127.0.0.1:8081/api/auth/session/validate}
  # Short positive cache removes duplicate DB session checks while keeping logout propagation bounded.
  session-cache-ttl: ${AUTH_SESSION_CACHE_TTL:5000}
  session-cache-max-entries: ${AUTH_SESSION_CACHE_MAX_ENTRIES:20000}
  # Login, AI, wallet and account limits remain shared; ordinary API traffic is limited in-process.
  local-general-rate-limit: ${AUTH_LOCAL_GENERAL_RATE_LIMIT:true}
